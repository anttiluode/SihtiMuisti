[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sihtimuisti"
version = "0.1.0"
description = "Visual memory that fades by octave: Sihti residues vs keyframes, thumbnails and merging at equal budget"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]
demo = ["opencv-python", "pillow"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
